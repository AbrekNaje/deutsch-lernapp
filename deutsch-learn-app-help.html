<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch Lernapp – Über das Projekt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ac:#534AB7;--acl:#EEEDFE;--acm:#7F77DD;
  --bg:#F5F0FF;--bg2:#EDE6FF;
  --txt:#1a1a1a;--txt2:#5a5468;--txt3:#8a84a0;
  --brd:rgba(130,100,200,0.18);
  --card-bg:#FFE8F0;--card-brd:rgba(220,130,160,0.25);
  --rad:14px;--radlg:20px;
}
body{
  font-family:'Georgia',-apple-system,'Segoe UI',serif;
  background:linear-gradient(180deg,#F5F0FF 0%,#FBF6FF 40%,#FFF5F8 100%);
  color:var(--txt);
  line-height:1.6;
  min-height:100vh;
}
.wrap{max-width:760px;margin:0 auto;padding:0 24px 80px}

/* Bayrak şeridi */
.flagbar{
  position:sticky;top:0;z-index:50;
  background:rgba(245,240,255,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--brd);
  padding:10px 16px;
  display:flex;justify-content:center;
  flex-wrap:wrap;gap:6px;
}
.flag-btn{
  background:none;border:1.5px solid transparent;border-radius:10px;
  padding:5px 8px;cursor:pointer;font-size:20px;
  display:flex;align-items:center;gap:6px;
  transition:all .15s;
  font-family:inherit;
}
.flag-btn span.lbl{font-size:11px;color:var(--txt3);font-family:-apple-system,'Segoe UI',sans-serif}
.flag-btn:hover{background:var(--acl)}
.flag-btn.active{background:var(--acl);border-color:var(--ac)}
.flag-btn.active span.lbl{color:var(--ac);font-weight:600}

/* Hero */
.hero{
  text-align:center;
  padding:56px 0 36px;
}
.hero-emblem{
  font-size:54px;
  margin-bottom:14px;
  display:inline-block;
}
.hero h1{
  font-size:38px;
  font-weight:700;
  letter-spacing:-0.5px;
  background:linear-gradient(135deg,var(--ac),#C2569C);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:10px;
}
.hero .sub{
  font-family:-apple-system,'Segoe UI',sans-serif;
  font-size:16px;color:var(--txt2);font-style:italic;
}

/* İçerik kartları */
.card{
  background:#fff;
  border:1px solid var(--brd);
  border-radius:var(--radlg);
  padding:28px 26px;
  margin-bottom:18px;
  box-shadow:0 2px 12px rgba(130,100,200,0.06);
}
.card.pink{background:var(--card-bg);border-color:var(--card-brd)}
.card h2{
  font-size:20px;font-weight:700;color:var(--ac);
  margin-bottom:12px;
  display:flex;align-items:center;gap:10px;
}
.card p{font-size:16px;color:var(--txt);margin-bottom:10px}
.card p:last-child{margin-bottom:0}
.card ul{margin:10px 0 0 0;padding-left:0;list-style:none}
.card li{
  font-size:15.5px;color:var(--txt);
  padding:9px 0 9px 30px;
  position:relative;
  border-bottom:1px solid rgba(130,100,200,0.08);
}
.card li:last-child{border-bottom:none}
.card li:before{
  content:'✓';position:absolute;left:0;top:9px;
  color:var(--ac);font-weight:700;
}
.card .step{
  display:flex;gap:14px;align-items:flex-start;
  padding:10px 0;
}
.step-num{
  flex-shrink:0;width:30px;height:30px;border-radius:50%;
  background:var(--acl);color:var(--ac);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;
  font-family:-apple-system,'Segoe UI',sans-serif;
}
.step-txt{font-size:15.5px;padding-top:4px}

/* Quote / persönliche Note */
.quote{
  font-style:italic;
  font-size:18px;
  color:var(--txt2);
  text-align:center;
  padding:6px 10px;
  border-left:3px solid var(--ac);
  background:var(--acl);
  border-radius:0 var(--rad) var(--rad) 0;
  margin:0 0 24px 0;
  padding:18px 22px;
}

/* CTA Buton */
.cta{
  display:block;text-align:center;
  background:linear-gradient(135deg,var(--ac),#7F6FD0);
  color:#fff;text-decoration:none;
  font-family:-apple-system,'Segoe UI',sans-serif;
  font-weight:600;font-size:16px;
  padding:16px 28px;border-radius:99px;
  margin:30px auto 10px;
  max-width:320px;
  box-shadow:0 6px 20px rgba(83,74,183,0.3);
  transition:transform .15s;
}
.cta:hover{transform:translateY(-2px)}

/* Footer */
.footer{
  text-align:center;
  padding-top:30px;
  font-family:-apple-system,'Segoe UI',sans-serif;
  font-size:13.5px;color:var(--txt3);
}
.footer a{color:var(--ac);text-decoration:none}
.footer a:hover{text-decoration:underline}

[dir="rtl"] .card li{padding:9px 30px 9px 0}
[dir="rtl"] .card li:before{left:auto;right:0}
[dir="rtl"] .quote{border-left:none;border-right:3px solid var(--ac);border-radius:var(--rad) 0 0 var(--rad)}
[dir="rtl"] .step{flex-direction:row-reverse}

@media(max-width:480px){
  .hero h1{font-size:28px}
  .hero-emblem{font-size:42px}
  .card{padding:22px 18px}
  .flag-btn span.lbl{display:none}
}
</style>
</head>

let currentLang = 'de';

function renderFlagbar(){
  const bar = document.getElementById('flagbar');
  bar.innerHTML = LANGS.map(l => `
    <button class="flag-btn${l.code===currentLang?' active':''}" data-code="${l.code}" onclick="setLang('${l.code}')">
      <span>${l.flag}</span><span class="lbl">${l.name}</span>
    </button>
  `).join('');
}

function setLang(code){
  currentLang = code;
  const t = T[code] || T.de;
  document.documentElement.lang = code;
  document.documentElement.dir = RTL.includes(code) ? 'rtl' : 'ltr';

  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-subtitle').textContent = t.subtitle;
  document.getElementById('t-intro').textContent = t.intro;

  document.querySelector('#t-what-h span').textContent = t.what_h;
  document.getElementById('t-what-p').textContent = t.what_p;

  document.querySelector('#t-features-h span').textContent = t.features_h;
  document.getElementById('t-features-list').innerHTML = t.features.map(f=>`<li>${f}</li>`).join('');

  document.querySelector('#t-start-h span').textContent = t.start_h;
  document.getElementById('t-start-steps').innerHTML = t.start.map((s,i)=>`
    <div class="step"><div class="step-num">${i+1}</div><div class="step-txt">${s}</div></div>
  `).join('');

  document.querySelector('#t-import-h span').textContent = t.import_h;
  document.getElementById('t-import-steps').innerHTML = t.import.map((s,i)=>`
    <div class="step"><div class="step-num">${i+1}</div><div class="step-txt">${s}</div></div>
  `).join('');

  document.getElementById('t-cta').textContent = t.cta;
  document.getElementById('t-footer').innerHTML = t.footer;

  renderFlagbar();
}

renderFlagbar();
setLang('de');
</script>
